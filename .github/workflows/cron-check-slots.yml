name: LTFRB 15-Minute Slot Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-slot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel slot monitor endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "::error::Missing GitHub Repository Secret: APP_URL (set it under Settings -> Secrets and variables -> Actions -> Repository secrets)"
            exit 1
          fi
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::Missing GitHub Repository Secret: CRON_SECRET (set it under Settings -> Secrets and variables -> Actions -> Repository secrets)"
            exit 1
          fi
          TARGET_URL="${APP_URL%/}/api/cron/check-slots"
          echo "Calling $TARGET_URL"
          curl -fsS -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
