name: LTFRB 15-Minute Slot Check

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  trigger-slot-check:
    runs-on: ubuntu-latest
    steps:
      - name: Call Vercel slot monitor endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "Skipping: set APP_URL and CRON_SECRET in GitHub Repository Secrets."
            exit 0
          fi
          TARGET_URL="${APP_URL%/}/api/cron/check-slots"
          curl -fsS -X POST "$TARGET_URL" \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Accept: application/json"
